# =====================================================================================================
# C18 -- the image-space base of both finals (public LB 0.33526, 2026-10-22).
#   apo_v2fix inner-edge MT, fusF PA with the confidence rule, ens_pp FL with empirical-Bayes shrinkage toward
#   scanner x muscle centres, half-strength rater-style offset; Telemed FL = UNSHRUNK per-clip median raw FL.
#   No post rules (every scanner in image space, no MT constant, no coupling pull).
# Every number follows from this file + the pinned inputs (sha256) + the pinned code (sha256):
#   umud-run --config configs/C18.yaml --stage build      -> artifacts/final/C18/C18.csv (byte-identical to the
#                                                            scored file, tests/test_final_package.py)
# Documentation-only keys (rationale, evidence, note, declaration, ...) are ignored by the runner.
# Re-pin after an intended change of an input or a pinned code file: python tools/pin_config.py configs/C18.yaml
# GPL-3.0-only.
# =====================================================================================================
schema: umud-config/2
name: C18
description: "C12 recipe + Telemed FL = unshrunk raw per-clip median FL"

reference:                        # the scored file this config must rebuild
  file: ${repo}/artifacts/candidates_v6/C18_C12_telemedFLraw.csv
  public_lb: 0.33526
  sha256: 3f9379f7e0c14b9c387ac0f29c81615115ec927b6f7d75c72b3a05504c8b633d
  expect: bytes

paths:
  out_dir: ${repo}/artifacts/final/${name}
  test_images: ${repo}/data/umud-challenge-muscle-architecture-in-ultrasound-data/test_images_v2/test_set_v2
  static_dir: ${repo}/data/external_umud_benchmark/static/benchmark_dataset_architecture_v0.1.0
  dynamic_dir: ${repo}/data/external_umud_benchmark/dynamic/benchmark_dataset_architecture_GM_dynamic_v0.1.0
  test_layout: ${repo}/artifacts/final/test_layout.csv            # umud-run --stage layout (from the images)
  v3_cache: ${repo}/artifacts/candidates_v3/cache                  # per-image measurements (measure stage)
  v4_cache: ${repo}/artifacts/eval_v4/flfix/cache                  # extra deep-strip PA columns (measure stage)
  muscle_table: ${repo}/artifacts/candidates_v5/muscle/test_muscle.csv   # burned-in muscle label OCR
  vl_labels: ${repo}/artifacts/candidates/bench/vl_labels.csv            # scripts/vl_labels.py
  note: "data/ (competition data, OSF benchmarks) and artifacts/ (maps, caches, outputs) are not in git. How each
    input is made: README.md 'Reproduce'. The per-image caches are the measure-stage output of the maps."

